[package]
name = "wisland"
version = "0.2.2"
description = "A lightweight Windows island for Codex, Obsidian, and focused desktop workflows"
authors = ["Wisland contributors"]
license = "MIT"
repository = "https://github.com/Lev1z/Wisland"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
lyrix = "26.2.1"
tauri-plugin-updater = "=2.9.0"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-numerics = "=0.2.0"
windows = { version = "0.61", features = [
    "UI_Composition_Desktop",
    "System",
    "Win32_System_WinRT_Composition",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",

    "Media_Control",
    "Storage_Streams",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com"
] }
winreg = "0.52"

[dev-dependencies]
minisign-verify = "=0.2.5"
