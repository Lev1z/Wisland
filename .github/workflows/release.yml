name: Release Tauri App

on:
  push:
    tags:
      - 'v*'

jobs:
  signing_configuration:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Check cloud signing availability
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloud signing is not configured; publish locally signed assets instead.'
          fi
  build-and-release:
    needs: signing_configuration
    if: needs.signing_configuration.outputs.enabled == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          if (-not (Test-Path "docs/releases/$env:GITHUB_REF_NAME.md")) { throw 'Release notes are required' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure signing secrets before publishing' }
          npm run test:version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/create-update-manifest.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:WISLAND_VERIFY_UPDATE_FILE = (Resolve-Path "src-tauri/target/release/bundle/nsis/Wisland_${version}_x64-setup.exe").Path
          cargo test --manifest-path src-tauri/Cargo.toml --lib signed_installer_accepts_original_and_rejects_tampering -- --ignored
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Wisland v${{ steps.version.outputs.VERSION }}"
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: false
          draft: true
          prerelease: false
      - name: Publish after complete asset upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false --latest --repo $env:GITHUB_REPOSITORY
