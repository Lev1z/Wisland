<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wisland 设置</title>
  <style>html,body{margin:0;background:#0d0d0d;color-scheme:dark}</style>
  <link rel="stylesheet" href="/src/settings.css" />
</head>
<body>
  <header id="window-titlebar" class="window-titlebar">
    <span class="window-title">WISLAND <i>/</i> SETTINGS</span>
    <div class="window-controls">
      <button id="window-minimize" type="button" aria-label="最小化">−</button>
      <button id="window-maximize" type="button" aria-label="最大化">□</button>
      <button id="window-close" type="button" aria-label="关闭">×</button>
    </div>
  </header>

  <main id="settings-shell" class="settings-shell settings-staggered-menu">
    <div class="menu-prelayers" aria-hidden="true">
      <span class="menu-prelayer menu-prelayer-back"></span>
      <span class="menu-prelayer menu-prelayer-front"></span>
    </div>
    <aside class="sidebar" aria-label="Wisland 设置菜单">
      <div class="brand">
        <img class="brand-mark" src="/src/assets/wisland-icon.png" alt="" />
        <h1>Wisland</h1>
      </div>
      <nav aria-label="设置分类">
        <button class="nav-item active" data-page="general"><span class="nav-index">01</span><span class="nav-label">常规</span></button>
        <button class="nav-item" data-page="music"><span class="nav-index">02</span><span class="nav-label">音乐</span></button>
        <button class="nav-item" data-page="codex"><span class="nav-index">03</span><span class="nav-label">Codex</span></button>
        <button class="nav-item" data-page="obsidian"><span class="nav-index">04</span><span class="nav-label">Obsidian</span></button>
        <button class="nav-item" data-page="custom"><span class="nav-index">05</span><span class="nav-label">自定义</span></button>
        <button class="nav-item" data-page="behavior"><span class="nav-index">06</span><span class="nav-label">行为</span></button>
        <button class="nav-item" data-page="about"><span class="nav-index">07</span><span class="nav-label">关于</span></button>
      </nav>
      <div class="sidebar-foot"><span>PERSONAL DESKTOP LAYER</span><b data-app-version>0.2.2</b></div>
    </aside>

    <section class="content">
      <header class="content-header">
        <div><h2 id="page-title">常规</h2><p id="page-description">只保留日常常驻真正需要的选项。</p></div>
        <span id="save-status" role="status" aria-live="polite"></span>
      </header>

      <div class="content-body">
        <section class="page active" id="page-general">
          <div class="setting-group">
            <h3>启动与外观</h3>
            <label class="setting-row">
              <span><strong>开机自启</strong></span>
              <input id="auto-start" type="checkbox" class="toggle autosave" />
            </label>
            <label class="setting-row">
              <span><strong>下次启动时</strong></span>
              <select id="startup-mode" class="autosave">
                <option value="capsule">胶囊态</option><option value="tray">托盘态</option>
              </select>
            </label>
            <div class="setting-row">
              <span><strong>立即切换</strong><small id="current-display-mode">正在读取…</small></span>
              <button id="switch-display-mode" class="secondary-button compact" type="button" disabled>切换</button>
            </div>
            <label class="setting-row">
              <span><strong>顶部小横条颜色</strong></span>
              <input id="indicator-color" type="color" value="#ffffff" class="autosave" />
            </label>
            <label class="setting-row">
              <span><strong>胶囊不透明度</strong></span>
              <span class="range-control"><input id="capsule-opacity" type="range" min="60" max="100" value="100" class="autosave" /><output id="capsule-opacity-value">100%</output></span>
            </label>
            <label class="setting-row">
              <span><strong>胶囊大小</strong></span>
              <select id="capsule-scale" class="autosave">
                <option value="0.8">0.8×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
              </select>
            </label>
            <label class="setting-row">
              <span><strong>导航样式</strong></span>
              <select id="icon-bar-style" class="autosave">
                <option value="option-wheel" selected>滚轮菜单</option><option value="classic">图标栏</option>
              </select>
            </label>
          </div>
          <div class="setting-group">
            <h3>图标顺序 · 拖动排序</h3>
            <div id="icon-order-list" class="order-list"></div>
          </div>
        </section>

        <section class="page" id="page-music">
          <div class="setting-group">
            <h3 title="每个播放器单独保存，范围 ±3 秒">歌词校准</h3>
            <div class="offset-panel">
              <div class="offset-panel-head"><span>已检测播放器</span><span id="lyric-offset-status"></span></div>
              <div id="lyric-offset-list" class="offset-list"></div>
              <p id="lyric-offset-empty" class="setting-hint standalone">播放一次音乐后，播放器会自动出现在这里。</p>
            </div>
          </div>
          <div class="setting-group">
            <h3>播放器来源</h3>
            <label class="setting-row">
              <span><strong>播放器白名单</strong><small>每行一个应用标识；关闭时不限制。</small></span>
              <input id="smtc-whitelist-enabled" type="checkbox" class="toggle autosave" />
            </label>
            <textarea id="smtc-whitelist" class="autosave" rows="6" placeholder="cloudmusic.exe&#10;qqmusic.exe"></textarea>
          </div>
        </section>

        <section class="page" id="page-codex">
          <div class="setting-group">
            <h3>任务状态</h3>
            <div class="setting-row static-row">
              <span><strong>Codex</strong></span>
              <span id="codex-hook-state" class="status-pill">未检测</span>
            </div>
            <div class="button-row">
              <button id="install-codex-hooks" class="primary-button" type="button">安装 / 修复 Hooks</button>
              <button id="clear-codex-status" class="secondary-button compact" type="button">重置任务状态</button>
            </div>
            <p class="setting-hint">安装后需重启 Codex。</p>
          </div>
        </section>

        <section class="page" id="page-obsidian">
          <div class="setting-group">
            <h3>随手记</h3>
            <label class="field-row">
              <span><strong>笔记库路径</strong></span>
              <input id="obsidian-vault-path" type="text" class="autosave" placeholder="C:\Notes\My Vault" />
            </label>
            <label class="field-row">
              <span><strong>每日笔记目录</strong><small>相对于笔记库，自动创建。</small></span>
              <input id="obsidian-daily-notes-dir" type="text" class="autosave" placeholder="Daily" />
            </label>
          </div>
        </section>

        <section class="page" id="page-custom">
          <div class="setting-group">
            <h3>胶囊左侧图标</h3>
            <div id="left-visual-options" class="visual-options"></div>
            <div class="import-row"><button id="import-left-visual" class="secondary-button compact" type="button">导入到素材库</button><span id="left-import-name"></span></div>
            <input id="left-visual-file" type="file" multiple accept="image/gif,image/webp,image/apng,image/png,image/svg+xml" hidden />
          </div>
          <div class="setting-group">
            <h3>胶囊右侧图标</h3>
            <div id="right-visual-options" class="visual-options"></div>
            <div class="import-row"><button id="import-right-visual" class="secondary-button compact" type="button">导入到素材库</button><span id="right-import-name"></span></div>
            <input id="right-visual-file" type="file" multiple accept="image/gif,image/webp,image/apng,image/png,image/svg+xml" hidden />
          </div>
          <div class="setting-group">
            <h3>主题</h3>
            <div id="border-effect-options" class="effect-options">
              <button type="button" data-effect="off"><i class="effect-preview effect-off"></i><span>暗黑</span></button>
              <button type="button" data-effect="aurora"><i class="effect-preview effect-aurora"></i><span>彩虹边框</span></button>
              <button type="button" data-effect="mono"><i class="effect-preview effect-mono"></i><span>白色边框</span></button>
              <button type="button" data-effect="glass"><i class="effect-preview effect-glass"></i><span>毛玻璃</span></button>
            </div>
            <div id="border-asset-options" class="visual-options border-assets"></div>
            <div class="import-row"><button id="import-border-visual" class="secondary-button compact" type="button">导入边框动图</button><span id="border-import-name"></span></div>
            <input id="border-visual-file" type="file" multiple accept="image/gif,image/webp,image/apng,image/png,image/svg+xml" hidden />
          </div>
        </section>

        <section class="page" id="page-behavior">
          <div class="setting-group">
            <h3>自动隐藏</h3>
            <label class="setting-row">
              <span><strong>启用进程黑名单</strong><small>全屏或前台程序匹配时隐藏 Wisland。</small></span>
              <input id="blacklist-enabled" type="checkbox" class="toggle autosave" />
            </label>
            <textarea id="blacklist" class="autosave" rows="8" placeholder="game.exe&#10;presentation.exe"></textarea>
          </div>
          <div class="setting-group">
            <h3>诊断</h3>
            <label class="setting-row">
              <span><strong>日志等级</strong></span>
              <select id="log-level" class="autosave"><option value="error">错误</option><option value="warn">警告</option><option value="info">信息</option><option value="debug">调试</option></select>
            </label>
            <div class="button-row">
              <button id="run-environment-check" class="secondary-button compact" type="button">运行环境检查</button>
              <button id="open-log-dir" class="text-button" type="button">打开日志目录</button>
            </div>
          </div>
        </section>

        <section class="page" id="page-about">
          <div class="about-card">
          <div class="about-brand">
            <img class="brand-mark large" src="/src/assets/wisland-icon.png" alt="" /><h3>Wisland <span data-app-version>0.2.2</span></h3>
            <button id="open-github-profile" class="github-profile-link" type="button" aria-label="打开 Lev1z 的 GitHub 主页">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.19-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
              <span>github.com/Lev1z</span>
            </button>
          </div>
          <section class="update-card" aria-label="软件更新">
            <div class="update-row"><div class="update-summary"><strong>软件更新</strong><button id="update-message" type="button" aria-live="polite" aria-haspopup="dialog" title="查看更新说明与详情">正在读取…</button><progress id="update-progress" aria-label="下载进度" hidden></progress></div><div class="update-actions"><button id="update-check" class="secondary-button" type="button">检查更新</button><button id="update-install" class="primary-button" type="button" hidden>下载更新</button><button id="update-manual" type="button">手动下载</button></div></div>
            <div class="update-row"><label title="最多每天一次，只检查，不自动下载或安装"><span>启动时自动检查</span><input id="update-auto" type="checkbox" class="toggle" /></label><small id="update-checked">尚未检查</small></div>
          </section>
          </div>
          <dialog id="update-details"><h3>更新详情</h3><p id="update-detail-status"></p><pre id="update-notes"></pre><button id="update-details-close" class="secondary-button" type="button">关闭</button></dialog>
          <dialog id="update-confirm"><h3>确认更新</h3><p id="update-confirm-text"></p><div class="button-row"><button id="update-cancel" class="secondary-button" type="button">暂不更新</button><button id="update-confirm-install" class="primary-button" type="button">确认下载并安装</button></div></dialog>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="/src/settings.ts"></script>
</body>
</html>
