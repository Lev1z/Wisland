<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisland · Codex</title>
    <link rel="stylesheet" href="/src/tray.css" />
  </head>
  <body>
    <section id="details" class="details" tabindex="-1" aria-label="Codex Runtime 侧栏">
      <header>
        <svg class="app-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.2"/><path d="m6 7 3 3-3 3m5 0h3" stroke="currentColor" stroke-width="1.2"/></svg>
        <strong>Codex</strong><span id="status-dot" class="status-dot"></span><span id="phase">Offline</span>
        <div class="header-actions">
          <button id="refresh" class="icon-button" type="button" title="刷新额度" aria-label="刷新额度"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M15.5 8A6 6 0 1 0 16 12M15.5 3.5V8H11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="settings" class="icon-button" type="button" title="设置" aria-label="打开 Wisland 设置"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 6h14M3 14h14" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="6" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="14" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/></svg></button>
          <button id="hide-sidebar" class="icon-button" type="button" title="隐藏侧栏（Esc）" aria-label="隐藏侧栏"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7.5 5 5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </header>
      <div class="section-label"><span>Usage limits</span><span>Remaining</span></div>
      <div id="quota-rows" class="quota-rows"></div>
      <section id="runtime" class="runtime" aria-label="Runtime Trajectory">
        <div class="trajectory-heading"><strong>Trajectory</strong><button id="follow" class="follow-button" type="button" aria-pressed="true" title="跟随最新事件；向上滚动可暂停">Live ↓</button></div>
        <div class="session-picker" id="session-picker">
          <button id="runtime-session" type="button" role="combobox" aria-label="选择本地会话" aria-haspopup="listbox" aria-expanded="false" aria-controls="runtime-sessions">
            <span id="runtime-session-label">自动 · 最近活跃</span><span class="session-chevron" aria-hidden="true">⌄</span>
          </button>
          <div id="runtime-sessions" role="listbox" aria-label="本地会话" hidden></div>
        </div>
        <div class="trajectory-body">
          <div id="trajectory-list" class="trajectory-list" tabindex="0" aria-label="按日志顺序排列的事件时间线"></div>
          <section id="inspector" class="inspector" hidden aria-label="事件详情">
            <div class="inspector-card">
              <div class="inspector-heading"><span id="inspector-title"></span><button id="close-inspector" class="icon-button" aria-label="关闭事件详情" title="返回轨迹（Esc）" type="button">×</button></div>
              <div class="inspector-tabs" role="tablist"><button id="tab-overview" role="tab" aria-selected="true" aria-controls="inspector-content" type="button">概述</button><button id="tab-raw" role="tab" aria-selected="false" aria-controls="inspector-content" type="button">原始内容</button></div>
              <div id="inspector-content" class="inspector-content" role="tabpanel" tabindex="0"></div>
            </div>
          </section>
        </div>
        <div id="runtime-notice" class="runtime-notice" title="按 JSONL 顺序排列；左侧标注已加载轮次。模型圆点仅来自带 response_id 的完成记录，不推算请求开始时间或缺失调用。"></div>
      </section>
      <footer>
        <span id="feedback" role="status" aria-live="polite"></span>
      </footer>
    </section>
    <script type="module" src="/src/tray.ts"></script>
  </body>
</html>
