<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisland · Codex</title>
    <link rel="stylesheet" href="/src/tray.css" />
  </head>
  <body>
    <section id="details" class="details" tabindex="-1" aria-label="Codex 额度详情">
      <header>
        <svg class="app-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.2"/><path d="m6 7 3 3-3 3m5 0h3" stroke="currentColor" stroke-width="1.2"/></svg>
        <strong>Codex</strong><span id="status-dot" class="status-dot"></span><span id="phase">Offline</span>
        <button id="settings" class="icon-button" type="button" title="设置" aria-label="打开 Wisland 设置"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 6h14M3 14h14" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="6" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="14" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/></svg></button>
      </header>
      <div class="section-label"><span>Usage limits</span><span>Remaining</span></div>
      <div id="quota-rows" class="quota-rows"></div>
      <footer>
        <button id="restore" class="text-button" type="button" title="返回桌面胶囊">显示胶囊</button>
        <span id="feedback" role="status" aria-live="polite"></span>
        <button id="refresh" class="icon-button" type="button" title="刷新额度" aria-label="刷新额度"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M15.5 8A6 6 0 1 0 16 12M15.5 3.5V8H11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </footer>
    </section>
    <script type="module" src="/src/tray.ts"></script>
  </body>
</html>
